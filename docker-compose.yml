services:
  postgres:
    image: postgres:17-alpine
    container_name: cluster-assurance-postgres
    restart: unless-stopped
    env_file:
      - path: ./config/appliance.env.example
      - path: ./config/appliance.env
        required: false
    environment:
      POSTGRES_DB: cao
      POSTGRES_USER: cao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cao -d cao"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - cao-postgres:/var/lib/postgresql/data

  cluster-assurance:
    build:
      context: .
      args:
        VITE_API_BASE: ""
    environment:
      CAO_MONITORING_ENABLED: "true"
    image: cluster-assurance-orchestrator:local
    container_name: cluster-assurance-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ./config/appliance.env.example
      - path: ./config/appliance.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cao-data:/data

  monitoring-worker:
    image: cluster-assurance-orchestrator:local
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    working_dir: /app/backend
    env_file:
      - path: ./config/appliance.env.example
      - path: ./config/appliance.env
        required: false
    environment:
      CAO_MONITORING_ENABLED: "true"
      CAO_READ_ONLY_MODE: "true"
      CAO_ENABLE_NCC: "false"
      CAO_ENABLE_SSH: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cao-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 20s
      start_period: 120s
      retries: 3

volumes:
  cao-data:
  cao-postgres:
