name: Project site, tutorials and PDF library

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build static demo
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_API_BASE: ""
          VITE_PUBLIC_BASE_PATH: "/Cluster-Assurance-Orchestrator/demo/"
          CAO_BUILD_REVISION: ${{ github.sha }}
          CAO_SOURCE_STATE: "clean"
        run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify curated site and stage demo
        run: |
          python -m pip install pypdf
          python scripts/check-publication.py --site site
          mkdir -p site/demo
          cp -R frontend/dist/. site/demo/
          python scripts/check-publication.py --site site --require-demo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
